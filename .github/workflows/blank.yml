name: Build Rafiqk APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q rafiqk-cairo-github-actions.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Apply adhkar update (Muqaddim booklet, auto-advance)
        run: |
          cp patch/AzkarData.kt "$PROJECT_DIR/app/src/main/java/com/rafiqk/app/data/AzkarData.kt"
          python3 - <<'PYEOF'
          import os
          d = os.environ["PROJECT_DIR"]
          h = d + "/app/src/main/java/com/rafiqk/app/ui/HomeScreen.kt"
          t = open(h, encoding="utf8").read()
          old = "        if (count < item.repeat) {\n            count++\n        } else {\n            index = (index + 1) % list.size\n            count = 0\n        }"
          new = "        count++\n        if (count >= item.repeat) {\n            index = (index + 1) % list.size\n            count = 0\n        }"
          if old in t:
              t = t.replace(old, new)
          open(h, "w", encoding="utf8").write(t)
          b = d + "/app/build.gradle.kts"
          s = open(b).read().replace("versionCode = 5", "versionCode = 6").replace('versionName = "2.3.0"', 'versionName = "2.4.0"')
          open(b, "w").write(s)
          PYEOF

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/rafiqk.jks"
          fi

      - name: Download Cairo font
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/font"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" \
            --output "$PROJECT_DIR/app/src/main/res/font/cairo.ttf"
          ls -l "$PROJECT_DIR/app/src/main/res/font"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug assembleRelease

      - name: Verify release signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$(find extracted -name app-release.apk -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rafiqk-apks
          path: extracted/**/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish debug APK as public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rafiqk latest (debug APK)
          make_latest: true
          files: extracted/**/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish signed release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signed
          name: Rafiqk signed release (for AppGallery)
          make_latest: false
          files: extracted/**/app/build/outputs/apk/release/app-release.apk
