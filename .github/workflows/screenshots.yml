name: App Screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download signed release APK
        run: |
          curl --fail --location --retry 3 -o app-release.apk \
            https://github.com/ghanmtaher-cpu/rafiqk/releases/download/signed/app-release.apk
          ls -l app-release.apk

      - name: Write screenshot script
        run: |
          mkdir -p shots
          cat > shots.py <<'PYEOF'
          import subprocess, time, re, sys
          import xml.etree.ElementTree as ET

          def adb(*a):
              return subprocess.run(["adb"] + list(a), capture_output=True, text=True).stdout

          def dump():
              adb("shell", "uiautomator", "dump", "/sdcard/u.xml")
              adb("pull", "/sdcard/u.xml", "u.xml")
              return ET.parse("u.xml").getroot()

          def find(text):
              for n in dump().iter("node"):
                  t = (n.get("text") or "") + " " + (n.get("content-desc") or "")
                  if text in t:
                      m = re.findall(r"\d+", n.get("bounds"))
                      x1, y1, x2, y2 = map(int, m)
                      return (x1 + x2) // 2, (y1 + y2) // 2
              return None

          def tap(text):
              p = find(text)
              print("tap", text, p, flush=True)
              if p:
                  adb("shell", "input", "tap", str(p[0]), str(p[1]))
              return p

          def shot(name):
              time.sleep(2)
              subprocess.run("adb exec-out screencap -p > shots/%s.png" % name, shell=True)
              print("shot", name, flush=True)

          adb("shell", "pm", "grant", "com.rafiqk.app", "android.permission.POST_NOTIFICATIONS")
          adb("shell", "am", "start", "-n", "com.rafiqk.app/.MainActivity")
          time.sleep(6)
          shot("00_setup")
          tap("اختيار مدينة")
          time.sleep(2)
          shot("01_cities")
          if not tap("القاهرة"):
              tap("Cairo")
          time.sleep(4)
          shot("02_home")
          adb("shell", "input", "swipe", "540", "1500", "540", "500", "400")
          shot("03_home_scrolled")
          adb("shell", "input", "swipe", "540", "1500", "540", "400", "400")
          shot("04_home_bottom")
          adb("shell", "input", "swipe", "540", "500", "540", "1700", "400")
          adb("shell", "input", "swipe", "540", "500", "540", "1700", "400")
          tap("السجل")
          shot("05_history")
          tap("الإعدادات")
          shot("06_settings")
          adb("shell", "input", "swipe", "540", "1500", "540", "400", "400")
          shot("07_settings_scrolled")
          tap("الرئيسية")
          time.sleep(1)
          tap("أذكار المساء")
          time.sleep(2)
          shot("08_adhkar")
          open("shots/ui_last.xml", "w").write(open("u.xml", encoding="utf8").read())
          PYEOF

      - name: Run app on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app-release.apk
            python3 shots.py

      - name: Resize to 720x1280
        run: |
          ls -l shots
          for f in shots/*.png; do
            convert "$f" -resize 720x1280 "${f%.png}-720x1280.png"
          done
          ls -l shots

      - name: Publish screenshots release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screenshots
          name: App screenshots
          make_latest: false
          files: |
            shots/*-720x1280.png
            shots/ui_last.xml
